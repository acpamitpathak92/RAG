top_k_dense: 20
top_k_bm25: 20
top_k_fused: 30
top_k_final: 5

# Some embedding models expect a different instruction/prefix on the QUERY side than on
# the document side (asymmetric retrieval) - e.g. Qwen3-Embedding's model card recommends
# a "Instruct: ...\nQuery: " style prefix for queries, with documents embedded plain. If
# search results seem to miss obviously-relevant documents, check whether your configured
# aiaas.embedding_model needs this and set it here. Left empty = no prefix (current
# behavior unchanged). Only applied to queries, never to document chunks at ingestion time.
query_embedding_instruction: ""

rrf_k: 60 # standard RRF smoothing constant

chunk:
  child_min_tokens: 200
  child_max_tokens: 400
  overlap_ratio: 0.18

confidence:
  weight_similarity: 0.35
  weight_rerank: 0.35
  weight_hallucination_pass_rate: 0.30
  low_confidence_threshold: 0.5
  caveat_penalty_multiplier: 0.7
  # Below this pre-generation retrieval_confidence, evidence is too weak to bother generating
  # from at all - the model tends to force a stretched, rambling "answer" out of irrelevant
  # chunks rather than admitting it doesn't know. Calibrated from observed scores: genuinely
  # relevant queries score ~0.2-0.4+, off-topic/vague queries score ~0.0-0.05.
  retrieval_insufficient_threshold: 0.1
