# Non-sensitive, environment-independent LLM settings only. AIaaS (the internal UBS
# gateway) is the only supported backend - every LLM call (chat, cleanup, grading,
# reranking, etc.) and every embedding call goes through it.
#
# AIaaS connection details (tenant, broker/gateway URLs, OAuth scopes, model names) are
# environment-specific and sensitive, so they live in .env instead of here - see
# .env.example for the full list of AIAAS_* variables. This file only holds the one
# setting that's genuinely the same across environments: per-role temperature.

# Per-role temperature (model is always AIAAS_CHAT_MODEL from .env - every role shares
# one chat model, just with its own temperature depending on how deterministic it needs
# to be).
roles:
  query_cleanup:
    temperature: 0.0
  router:
    temperature: 0.0
  query_rewrite:
    temperature: 0.3
  grader:
    temperature: 0.0
  query_refinement:
    temperature: 0.3
  generation:
    temperature: 0.2
  judge:
    temperature: 0.0
  reranker:
    # Scores retrieved-chunk relevance in one batched prompt (see ranking/reranker.py) -
    # doesn't write anything user-facing, so a low temperature keeps scoring consistent.
    temperature: 0.0
